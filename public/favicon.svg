<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#0a0a0a"/>
  <!-- Signal wave: flat → spike → flat → smaller spike → flat -->
  <polyline
    points="2,16 7,16 9,8 11,24 13,16 17,16 19,10 21,22 23,16 30,16"
    stroke="#f5f5f5"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Subtle scan dot at peak -->
  <circle cx="9" cy="8" r="1.2" fill="#f5f5f5"/>
</svg>
