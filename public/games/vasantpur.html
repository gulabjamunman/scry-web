<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vasantpur · SCRY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#f2ece4;--ink2:#c8bca8;--ink3:#8c7c68;--ink4:#564838;--ink5:#36281c;
  --page:#0f0d0b;--page2:#161310;--page3:#1e1a16;--page4:#272218;
  --rule:#272018;--rule2:#383028;--rule3:#484038;
  --accent:#e8b870;--accent2:#c88848;--accent3:#a87030;
  --blue:#68b8f8;--green:#58c87a;--red:#e87070;--amber:#e8a838;
  --scry:#c898ff;--scry-bg:rgba(200,152,255,.09);--scry-rule:rgba(200,152,255,.22);
  --sky1:#8a2e06;--sky2:#ffaa38;--bld:#241808;--gnd:#ede0ca;--gnd2:#5a380e;
}
html{height:100%;background:var(--page);overscroll-behavior-y:none}
body{min-height:100dvh;background:var(--page);color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;font-size:16px;line-height:1.8;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:none}
#shell{min-height:100dvh;display:flex;flex-direction:column;max-width:660px;margin:0 auto}
#topbar{position:sticky;top:0;z-index:50;background:rgba(15,13,11,.92);
  border-bottom:.5px solid var(--rule);padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tb-logo{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);font-weight:700}
.tb-mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.bp{width:5px;height:5px;border-radius:50%;background:var(--rule3);transition:all .4s}
.bp.dn{background:var(--ink4)}.bp.on{width:18px;border-radius:3px;background:var(--accent)}
.tb-r{font-family:'Courier New',monospace;font-size:10px;color:var(--ink4);letter-spacing:.04em}
#scene{position:relative;flex-shrink:0;line-height:0;overflow:hidden}
#scene svg{display:block;width:100%;max-height:38vh}
#sfade{position:absolute;inset:0;background:var(--page);opacity:0;pointer-events:none;transition:opacity .65s;z-index:2}
#stime{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:10px 18px 12px;
  background:linear-gradient(transparent,rgba(15,13,11,.96));
  font-family:'Courier New',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
#narr{flex:1;padding:22px 18px 8px}
.p{font-size:15.5px;line-height:1.88;color:var(--ink2);margin-bottom:11px;opacity:0;font-family:'Georgia',serif}
.p.in{animation:fsin .5s ease forwards}
.p em{color:var(--ink);font-style:italic}.p strong{color:var(--ink);font-weight:normal}
.p.aside{color:var(--ink3);font-style:italic;border-left:2px solid var(--rule2);padding-left:12px;font-size:14.5px}
@keyframes fsin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.notif{border:.5px solid var(--rule2);border-left:3px solid var(--blue);border-radius:10px;
  padding:11px 14px;background:var(--page3);margin:14px 0;opacity:0;transition:opacity .4s}
.notif.in{opacity:1}
.notif-app{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);margin-bottom:3px}
.notif-txt{font-size:14.5px;color:var(--ink);line-height:1.4}
.src{border:.5px solid var(--rule2);border-radius:10px;overflow:hidden;margin:14px 0;opacity:0;transition:opacity .35s}
.src.in{opacity:1}
.src-hd{padding:10px 14px;background:var(--page3);border-bottom:.5px solid var(--rule)}
.src-pub{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink4);margin-bottom:3px}
.src-hl{font-size:15px;color:var(--ink);line-height:1.35}
.src-bd{padding:14px;background:var(--page2)}
.src-bd p{font-size:13px;line-height:1.82;color:var(--ink2);margin-bottom:9px;font-family:'Georgia',serif}
.src-bd p:last-child{margin-bottom:0}.src-bd strong{color:var(--ink)}
.absent{font-family:'Courier New',monospace;font-size:11px;color:var(--amber);border-bottom:1px dashed rgba(232,168,56,.35)}
.sr{padding-bottom:9px;margin-bottom:9px;border-bottom:.5px solid var(--rule)}
.sr:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none}
.sr-pub{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink4);margin-bottom:2px}
.sr-hl{font-size:13px;color:var(--ink);line-height:1.35;margin-bottom:2px}
.sr-ex{font-size:12px;color:var(--ink2);line-height:1.5}
.chat{margin:14px 0}
.crow{display:flex;gap:9px;margin-bottom:8px;align-items:flex-start;opacity:0}
.crow.in{animation:bubin .4s cubic-bezier(.34,1.3,.64,1) forwards}
@keyframes bubin{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:translateX(0)}}
.cav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.cbub{border:.5px solid var(--rule2);border-radius:3px 10px 10px 10px;padding:8px 12px;max-width:90%;background:var(--page3)}
.cname{font-family:'Courier New',monospace;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.ctxt{font-size:13px;color:var(--ink2);line-height:1.55}
.typing{display:none;gap:4px;align-items:center;padding:9px 13px;background:var(--page3);border:.5px solid var(--rule2);border-radius:3px 10px 10px 10px;width:fit-content;margin-bottom:8px}
.typing.on{display:flex}
.td{width:5px;height:5px;border-radius:50%;background:var(--ink4)}
.td:nth-child(1){animation:db .9s infinite}.td:nth-child(2){animation:db .9s infinite .2s}.td:nth-child(3){animation:db .9s infinite .4s}
@keyframes db{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.vn-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.vn-play{width:26px;height:26px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.vn-play:active{transform:scale(.92)}
.vnw{flex:1;display:flex;align-items:center;gap:2px;height:17px}
.vb{width:2.5px;border-radius:1px;background:var(--rule3);transform-origin:center}
.vb.on{background:var(--green)}
.vts{font-family:'Courier New',monospace;font-size:9px;color:var(--ink4)}
.vtrans{font-size:12px;color:var(--ink3);font-style:italic;line-height:1.55;margin-top:5px;border-left:2px solid var(--rule2);padding-left:9px}
.cmp{border:.5px solid var(--rule2);border-radius:10px;overflow:hidden;margin:14px 0}
.cmp-hd{padding:8px 14px;background:var(--page3);border-bottom:.5px solid var(--rule);font-family:'Courier New',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4)}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr}
.cmp-col{padding:11px 13px;font-size:12px;line-height:1.68;color:var(--ink2)}
.cmp-col:first-child{border-right:.5px solid var(--rule)}
.cmp-pub{font-family:'Courier New',monospace;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink4);margin-bottom:4px}
.cmp-col p{margin-bottom:6px}.cmp-col p:last-child{margin-bottom:0}
.match{background:rgba(232,168,56,.16);border-radius:2px;padding:0 2px}
.mirror{border-left:3px solid var(--accent2);border-radius:0 10px 10px 0;padding:13px 15px;background:var(--page3);margin:16px 0;opacity:0;transition:opacity .4s}
.mirror.in{opacity:1}
.mirror-lbl{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
.mirror-txt{font-size:14px;color:var(--ink);line-height:1.72;font-family:'Georgia',serif}
.mirror-txt em{font-style:italic;color:var(--ink2)}
.mirror-sub{font-size:12px;color:var(--ink3);margin-top:6px;font-style:italic;line-height:1.55}
.scry{border:.5px solid var(--scry-rule);border-radius:10px;background:var(--scry-bg);padding:14px;margin:16px 0;opacity:0;transition:opacity .4s}
.scry.in{opacity:1}
.scry-hd{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.scry-dot{width:7px;height:7px;border-radius:50%;background:var(--scry);flex-shrink:0}
.scry-lbl{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--scry);font-weight:700}
.scry-sub{font-size:12.5px;color:var(--ink3);margin-bottom:12px;font-style:italic;line-height:1.55}
.scry-row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.scry-rl{font-size:11px;color:var(--ink3);width:90px;flex-shrink:0;font-family:'Courier New',monospace}
.scry-trk{flex:1;height:4px;border-radius:2px;background:var(--rule2);position:relative}
.scry-mid{position:absolute;left:50%;top:-3px;width:.5px;height:10px;background:var(--rule3)}
.scry-fill{position:absolute;top:0;height:100%;border-radius:2px;transition:width .9s cubic-bezier(.34,1.28,.64,1),left .9s cubic-bezier(.34,1.28,.64,1)}
.scry-val{font-family:'Courier New',monospace;font-size:10px;color:var(--ink4);width:38px;text-align:right;flex-shrink:0}
.scry-pubs{display:flex;flex-wrap:wrap;gap:4px;margin:9px 0 6px}
.scry-pub{font-family:'Courier New',monospace;font-size:9px;padding:2px 8px;border-radius:4px;border:.5px solid var(--rule2);color:var(--ink3);background:var(--page2)}
.scry-pub.silent{border-color:rgba(232,168,56,.4);color:var(--amber);background:rgba(232,168,56,.06)}
.scry-insight{font-size:13px;color:var(--ink2);line-height:1.68;margin-top:9px;padding-top:9px;border-top:.5px solid var(--scry-rule);font-style:italic}
.scry-missing{border:.5px solid var(--scry-rule);border-radius:10px;padding:12px 14px;background:var(--scry-bg);margin:14px 0}
.scry-miss-body{font-size:13px;color:var(--ink2);line-height:1.65;margin-bottom:8px}
.scry-miss-body strong{color:var(--scry)}
.scry-skip{font-family:'Courier New',monospace;font-size:10px;color:var(--ink4);background:none;border:none;cursor:pointer;padding:2px 0;letter-spacing:.04em}
.anno-section{margin-top:12px;padding-top:11px;border-top:.5px solid var(--scry-rule)}
.anno-q{font-size:13.5px;color:var(--ink2);line-height:1.65;margin-bottom:10px;font-style:italic}
.anno-opts{display:flex;flex-direction:column;gap:5px}
.ao{border:.5px solid var(--scry-rule);border-radius:8px;padding:10px 12px;background:var(--page2);cursor:pointer;transition:all .15s;text-align:left;width:100%;font-family:'Georgia',serif}
.ao:active,.ao:hover{background:var(--page3);border-color:var(--scry)}
.ao.sel{border-color:var(--scry);background:var(--scry-bg)}.ao.dim{opacity:.2;pointer-events:none}
.ao-main{font-size:13px;color:var(--ink);line-height:1.4;margin-bottom:2px}
.ao-sub{font-size:11px;color:var(--ink4);font-family:'Courier New',monospace}
.anno-res{border:.5px solid var(--scry-rule);border-radius:8px;padding:12px 13px;background:var(--scry-bg);margin-top:10px;display:none}
.ab-row{display:flex;align-items:center;gap:7px;margin:5px 0}
.ab-l{font-size:11px;color:var(--ink3);width:115px;flex-shrink:0;font-family:'Courier New',monospace}
.ab-t{flex:1;height:5px;border-radius:3px;background:var(--rule2);overflow:hidden}
.ab-f{height:100%;border-radius:3px;background:var(--scry);transition:width 1.2s ease}
.anno-note{font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:9px;font-style:italic}
.dec{margin:16px 0}
.dec-q{font-size:15px;color:var(--ink);line-height:1.65;margin-bottom:7px;padding-left:13px;border-left:3px solid var(--accent2)}
.dec-ctx{font-size:13px;color:var(--ink3);margin-bottom:12px;font-style:italic;line-height:1.55;padding-left:13px}
.choices{display:flex;flex-direction:column;gap:6px}
.ch{border:.5px solid var(--rule2);border-radius:10px;padding:12px 15px;background:var(--page2);cursor:pointer;transition:all .22s;text-align:left;width:100%;font-family:'Georgia',serif;opacity:0;transform:translateY(4px)}
.ch.in{opacity:1;transform:translateY(0)}.ch:active,.ch:hover{border-color:var(--rule3);background:var(--page3);transform:translateX(4px)}
.ch.sel{border-color:var(--accent);background:var(--page3);transform:translateX(0)}.ch.dim{opacity:.16;pointer-events:none;transform:none}
.ch-main{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:2px}
.ch-sub{font-size:11px;color:var(--ink4);font-family:'Courier New',monospace;margin-top:3px}
.stmt{border:.5px solid var(--rule2);border-radius:10px;padding:16px;background:var(--page2);margin:14px 0;font-size:14.5px;line-height:1.88;color:var(--ink2)}
.stmt p{margin-bottom:11px}.stmt p:last-child{margin-bottom:0}
.stmt .ed{background:rgba(104,184,248,.1);border-radius:3px;padding:0 3px;cursor:pointer;border-bottom:1px solid rgba(104,184,248,.28);color:var(--ink);transition:all .2s}
.stmt .ed:hover{background:rgba(104,184,248,.2)}.stmt .ed.changed{background:rgba(88,200,122,.09);border-bottom-color:rgba(88,200,122,.3)}
.obar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0}
.ob{height:100%;transition:width 1.8s ease}
.oleg{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ole{display:flex;align-items:center;gap:5px;font-family:'Courier New',monospace;font-size:10px;color:var(--ink4)}
.olc{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.ocard{border:.5px solid var(--rule2);border-radius:10px;padding:13px 15px;background:var(--page3);margin-bottom:10px}
.ocard-tag{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:5px;display:block}
.ocard-title{font-size:14px;color:var(--ink);margin-bottom:5px}
.ocard-desc{font-size:13px;color:var(--ink2);line-height:1.7;font-family:'Georgia',serif}
.profile{border:.5px solid var(--accent2);border-radius:12px;padding:16px;background:var(--page3);margin:14px 0}
.profile-lbl{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:12px}
.prow{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:.5px solid var(--rule2)}
.prow:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.prow-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px}
.prow-label{font-family:'Courier New',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.prow-val{font-size:13.5px;color:var(--ink);line-height:1.55;font-family:'Georgia',serif}
.prow-val em{color:var(--ink2);font-style:italic}
.proximity{border:.5px solid var(--scry-rule);border-radius:10px;padding:14px;background:var(--scry-bg);margin:14px 0}
.proximity-lbl{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--scry);margin-bottom:7px}
.proximity-txt{font-size:13.5px;color:var(--ink2);line-height:1.72;font-family:'Georgia',serif}
.proximity-txt strong{color:var(--ink)}.proximity-txt em{color:var(--ink3);font-style:italic}
.ctn{width:100%;padding:11px;border-radius:9px;border:.5px solid var(--rule2);background:none;color:var(--ink4);font-size:12px;font-family:'Courier New',monospace;letter-spacing:.05em;cursor:pointer;transition:all .18s;margin-top:10px;opacity:0;pointer-events:none}
.ctn.rdy{opacity:1;pointer-events:auto;color:var(--ink3)}.ctn:hover{background:var(--page3);color:var(--ink);border-color:var(--rule3)}
.nxt{width:100%;padding:13px;border-radius:10px;background:var(--accent3);color:var(--page);border:none;font-size:12px;font-family:'Courier New',monospace;letter-spacing:.07em;cursor:pointer;transition:all .18s;margin-top:8px}
.nxt:hover,.nxt:active{background:var(--accent2)}
#hw{margin-top:10px;padding-top:9px;border-top:.5px solid var(--rule)}
.htb{font-family:'Courier New',monospace;font-size:10px;color:var(--ink4);cursor:pointer;background:none;border:none;padding:0;letter-spacing:.05em;transition:color .15s}
.htb:hover{color:var(--ink3)}
.htxt{font-size:13px;color:var(--ink2);line-height:1.65;margin-top:8px;padding:10px 13px;border-radius:8px;background:var(--page3);border:.5px solid var(--rule2);display:none;font-style:italic}
.htxt.on{display:block}
.spacer{height:36px}
@keyframes sunp{0%,100%{opacity:.32}50%{opacity:.52}}
@keyframes steam{0%{opacity:0}40%{opacity:.6}100%{opacity:0;transform:translateY(-18px)}}
@keyframes bfly{from{transform:translateX(-60px)}to{transform:translateX(750px) translateY(-22px)}}
@keyframes twink{0%,100%{opacity:.35}50%{opacity:.88}}
@keyframes lp{0%,100%{opacity:.55}50%{opacity:.82}}
@keyframes hp{0%,100%{opacity:.48}50%{opacity:.76}}
@keyframes cm{from{transform:translateX(0)}to{transform:translateX(100px)}}
@keyframes sapp{from{opacity:0}to{opacity:.9}}
@keyframes phshk{0%,100%{transform:translate(0,0)}15%{transform:translate(-2px,1px) rotate(-2deg)}35%{transform:translate(2px,-1px) rotate(2deg)}55%{transform:translate(-1px,0)}75%{transform:translate(1px,0)}}
@keyframes wba{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes sg{from{opacity:.48}to{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">
    <span class="tb-logo">SCRY</span>
    <div class="tb-mid" id="bdots"></div>
    <span class="tb-r" id="tbb">Loading...</span>
  </div>
  <div id="scene"><div id="sfade"></div><div id="stime"></div></div>
  <div id="narr">
    <div id="hw">
      <button class="htb" id="htb" onclick="tH()">? hint</button>
      <div class="htxt" id="htxt"></div>
    </div>
  </div>
  <div class="spacer"></div>
</div>
<script>

// ═══════════════════════════════════════════════════════════════════
// SCENE RENDERER
// ═══════════════════════════════════════════════════════════════════

const PALETTES = {
  warm_dawn:    { sky1:'#8a2e06', sky2:'#ffaa38', bld:'#241808', gnd:'#ede0ca', gnd2:'#5a380e', stars:false },
  blue_night:   { sky1:'#060418', sky2:'#160e40', bld:'#120c08', gnd:'#100c08', gnd2:'#2c1808', stars:true  },
  amber_evening:{ sky1:'#7a2c06', sky2:'#ff9c2a', bld:'#241408', gnd:'#281c0a', gnd2:'#5a380e', stars:false },
  grey_overcast:{ sky1:'#1a1a20', sky2:'#3a3a48', bld:'#181820', gnd:'#20202c', gnd2:'#28283a', stars:false },
  harsh_noon:   { sky1:'#1a3a6a', sky2:'#4a9aee', bld:'#241808', gnd:'#ddd4b0', gnd2:'#5a480e', stars:false },
  deep_evening: { sky1:'#0a0820', sky2:'#201848', bld:'#0c0a10', gnd:'#100c08', gnd2:'#1c1420', stars:true  },
}

const BACKDROPS = {
  city_skyline: (p) => `
    <rect x="0" y="148" width="40" height="70" fill="${p.bld}"/>
    <rect x="44" y="132" width="28" height="86" fill="${p.bld}"/>
    <rect x="76" y="150" width="46" height="68" fill="${p.bld}"/>
    <rect x="126" y="136" width="34" height="82" fill="${p.bld}"/>
    <rect x="164" y="150" width="26" height="68" fill="${p.bld}"/>
    <rect x="194" y="118" width="22" height="100" fill="${p.bld}"/>
    <rect x="220" y="134" width="54" height="84" fill="${p.bld}"/>
    <rect x="278" y="146" width="28" height="72" fill="${p.bld}"/>
    <rect x="310" y="154" width="112" height="64" fill="${p.bld}" opacity=".85"/>
    <rect x="430" y="124" width="30" height="94" fill="${p.bld}"/>
    <rect x="464" y="140" width="50" height="78" fill="${p.bld}"/>
    <rect x="518" y="122" width="26" height="96" fill="${p.bld}"/>
    <rect x="548" y="142" width="95" height="76" fill="${p.bld}"/>
    <rect x="648" y="130" width="52" height="88" fill="${p.bld}"/>`,
  coastal_port: (p) => `

  ceiling_fan: `
    <g style="animation:cm 8s linear infinite;transform-origin:350px 20px">

      <rect x="348" y="6" width="4" height="28" rx="2" fill="#3a3020" opacity=".5"/>

  stars_field: (count) => {
    var n = count || 18
    var out = []
    for (var i = 0; i < n; i++) {
      var x = 30 + (i * 37) % 640
      var y = 10 + (i * 19) % 80
      var r = [1.1,1.6,2.1,1.4,0.9][i%5]
      var d = (i*0.3).toFixed(1)
      out.push('<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#e0d8ff" style="animation:twink '+(1.8+i%8*0.2)+'s ease infinite '+d+'s"/>')
    }
    return out.join('')
  },
  window_glow: function(col, x) {
    return '<rect x="'+(x||50)+'" y="130" width="17" height="11" rx="1" fill="'+(col||'#f0a020')+'" opacity=".44" style="animation:twink 3.1s ease infinite"/>'
  },

function buildScene(desc) {
  if (!desc) return buildDefaultScene()
  var palKey = desc.palette || 'warm_dawn'
  var pal = PALETTES[palKey] || PALETTES.warm_dawn
  var skyGrad = '<defs><linearGradient id="sk_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+pal.sky1+'"/><stop offset="100%" stop-color="'+pal.sky2+'"/></linearGradient></defs><rect width="700" height="218" fill="url(#sk_bg)"/>'
  var starsLayer = pal.stars ? AMBIENT.stars_field(16) : ''
  var sunX = desc.sun_x || (desc.palette === 'amber_evening' ? 596 : 88)
  var sunLayer = (!pal.stars && desc.palette !== 'grey_overcast') ? AMBIENT.sun(sunX, 48, 19) : ''
  var birdLayer = (palKey === 'warm_dawn' || palKey === 'harsh_noon') ? AMBIENT.birds : ''
  var backdropKey = desc.backdrop || 'city_skyline'
  var backdropFn = BACKDROPS[backdropKey]
  var backdrop = backdropFn ? backdropFn(pal) : BACKDROPS.city_skyline(pal)
  var tarpLayer = (backdropKey === 'bazaar_and_market') ? AMBIENT.tarpaulin_roofs : ''
  var waterLayer = (backdropKey === 'coastal_port') ? AMBIENT.water_body : ''
  var groundKey = desc.ground || (
    desc.backdrop === 'agricultural_fields' ? 'field_exterior' :
    desc.backdrop === 'coastal_port' ? 'water_exterior' :
    (desc.backdrop === 'newsroom_interior' || desc.backdrop === 'court_corridor' || desc.backdrop === 'hospital_corridor') ? 'office_interior' :
    'home_interior'
  )
  var groundFn = GROUNDS[groundKey]
  var ground = groundFn ? groundFn(pal) : GROUNDS.home_interior(pal)
  var lampsLayer = (pal.stars && backdropKey === 'city_skyline') ? AMBIENT.street_lamps : ''
  var glowLayer = ''
  if (pal.stars) {
    var glowXs = [50,136,231,476,530]
    for (var gi = 0; gi < glowXs.length; gi++) glowLayer += AMBIENT.window_glow('#f0a020', glowXs[gi])
  }
  var fgKey = desc.key_object || 'phone_with_notification'
  var fgObj = FG_OBJECTS[fgKey] || FG_OBJECTS.phone_with_notification
  var ambDetail = desc.ambient === 'ceiling_fan' ? AMBIENT.ceiling_fan : ''
  var chaiExtra = (fgKey === 'chai_cup') ? FG_OBJECTS.chai_cup : ''
  return '<svg width="100%" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">'+skyGrad+starsLayer+sunLayer+birdLayer+backdrop+waterLayer+tarpLayer+ground+glowLayer+lampsLayer+fgObj+ambDetail+chaiExtra+'</svg>'
}

function buildHallScene() {
  var seats = [90,134,178,222,266,310,354,398,442,486,530,574,618]
  var seatsSvg = ''
  for (var i = 0; i < seats.length; i++) {
    var x = seats[i]
    var cy = (x % 2 === 0) ? 208 : 206
    var ry = (x % 2 === 0) ? 214 : 212

// ═══════════════════════════════════════════════════════════════════
// GE — GAME EVENTS
// ═══════════════════════════════════════════════════════════════════

var GE = (function() {
  var PERSONA = 'meera'
  var DIM_MAP = {
    source_selection:'trust_hierarchy',opinion_formation:'framing_absorption',
    bayesian_update:'prior_update',silence_registration:'absence_detection',
    wire_annotation:'source_attribution',synthesis_edit:'synthesis_under_pressure',
    vote:'collective_action'
  }
  var OPINION_FR = {0:0.4,1:-0.2,2:0.0,3:0.2}
  var UPDATE_FR  = {0:-0.1,1:0.3,2:0.0,3:-0.1}
  var firstSrcFr=null,b2Delta=null,beatStart={},beatTimings={}
  var sessionAnswers={},sessionScores={},answerChanges={},revealsEngaged={}
  var decisionStart=Date.now()

  function post(type,payload){
    try{ window.parent.postMessage({type:type,payload:payload},'*') }
    catch(e){ console.warn('[GE] postMessage:',e) }
  }

  function framingLabel(fr){
    if(fr===null||fr===undefined)return null
    if(fr<-0.2)return 'left'
    if(fr>0.2)return 'right'
    return 'neutral'
  }

  function init(story,scenarioId){
    beatStart[1]=Date.now();decisionStart=Date.now()
    post('vasantpur:log',{event:'session_init',clusterId:story&&story.scry&&story.scry.cluster_id||null,scenarioId:scenarioId||null,clusterTopic:story&&story.scry&&story.scry.topic||null,persona:PERSONA})
  }

  function decision(roundType,params){
    var timingMs=Date.now()-decisionStart
    var behavioralDim=DIM_MAP[roundType]||roundType
    var choiceIndex=params.choiceIndex!=null?params.choiceIndex:0
    var row={session_id:null,user_id:null,anon_id:null,cluster_id:null,scenario_id:null,
      topic:null,persona:PERSONA,behavioral_dim:behavioralDim,round_index:params.roundIndex,
      round_type:roundType,time_taken_ms:timingMs,changed_answer:params.changedAnswer||false,
      num_changes:params.numChanges||0,answer:{choice_index:choiceIndex}}

    if(roundType==='source_selection'){
      firstSrcFr=params.srcFr!=null?params.srcFr:null
      row.shown_framing_values=params.allSrcs||null
      row.answer={choice_index:choiceIndex,outlet_type:params.outletType,fr:params.srcFr}
      row.actual_framing_score=params.srcFr!=null?params.srcFr:null
      row.framing_estimate=framingLabel(params.srcFr)
      sessionAnswers.b1_src=choiceIndex
      sessionAnswers._src_outlet_type=params.outletType||'unknown'
      answerChanges.b1_src=params.numChanges||0
    } else if(roundType==='opinion_formation'){
      var iF=OPINION_FR[choiceIndex]!=null?OPINION_FR[choiceIndex]:0
      var err=firstSrcFr!==null?Math.abs(iF-firstSrcFr):null
      row.answer={choice_index:choiceIndex,implied_fr:iF}
      row.actual_framing_score=firstSrcFr;row.framing_estimate=framingLabel(iF);row.framing_error=err
      sessionAnswers.b1_opinion=choiceIndex;sessionScores.b1=err!==null?Math.max(0,1-err):0
    } else if(roundType==='bayesian_update'){
      b2Delta=(params.src1Fr!==null&&params.src2Fr!==null)?Math.abs(params.src2Fr-params.src1Fr):null
      var iF2=UPDATE_FR[choiceIndex]!=null?UPDATE_FR[choiceIndex]:0
      var didUp=choiceIndex===0||choiceIndex===2
      row.shown_framing_values=[{src1_fr:params.src1Fr,src2_fr:params.src2Fr,delta:b2Delta}]
      row.answer={choice_index:choiceIndex,update_type:['held_both','defaulted','uncertain','reflected'][choiceIndex]}
      row.actual_framing_score=params.src2Fr!=null?params.src2Fr:null;row.framing_estimate=framingLabel(iF2)
      row.framing_error=b2Delta;row.is_correct=didUp
      sessionAnswers.b2_update=choiceIndex;answerChanges.b2=params.numChanges||0;sessionScores.b2=didUp?1:0
    } else if(roundType==='silence_registration'){
      var noticed=choiceIndex===0||choiceIndex===2,acted=choiceIndex===2
      row.shown_framing_values=params.silentPublishers||null
      row.answer={choice_index:choiceIndex,noticed:noticed,acted:acted};row.is_correct=noticed
      row.intensity_estimate=noticed?(acted?'high':'medium'):'low'
      sessionAnswers.b3_silence=choiceIndex;sessionScores.b3=noticed?1:0;revealsEngaged.b3_scry=true
    } else if(roundType==='wire_annotation'){
      row.article_ids=params.articleIds||null;row.shown_framing_values=params.allOptions||null
      row.answer={label:params.annoLabel};row.framing_estimate=params.annoLabel||null
      sessionAnswers.b4_anno=params.annoLabel;revealsEngaged.b4_scry=true
    } else if(roundType==='synthesis_edit'){
      var fF=params.finalFr!=null?params.finalFr:null
      var err2=(fF!==null&&firstSrcFr!==null)?Math.abs(fF-firstSrcFr):null
      row.answer={edits_count:params.editsCount||0};row.actual_framing_score=fF
      row.framing_error=err2;row.num_changes=params.editsCount||0
      sessionAnswers.b5_edits=params.editsCount||0;sessionScores.b5=(params.editsCount||0)>0?1:0
    } else if(roundType==='vote'){
      var labels=['independent_review','conditional','approve']
      row.answer={choice_index:choiceIndex,label:labels[choiceIndex]}
      row.intensity_estimate=labels[choiceIndex];sessionAnswers.b5_vote=choiceIndex
    }

    post('vasantpur:decision',row)
    post('vasantpur:log',{event:'session_patch',answers:sessionAnswers,scores:sessionScores,answer_changes:answerChanges,reveals_engaged:revealsEngaged})
    decisionStart=Date.now()
  }

  function beatComplete(completedBeat){
    var elapsed=Date.now()-(beatStart[completedBeat]||Date.now())
    beatTimings['b'+completedBeat]=elapsed;beatStart[completedBeat+1]=Date.now();decisionStart=Date.now()
    post('vasantpur:beatComplete',{beat:completedBeat,timingMs:elapsed})
  }

  function scryEngaged(key){
    revealsEngaged[key]=true;post('vasantpur:scryEngaged',{key:key})
  }

  function finish(){
    var totalScore=Object.values(sessionScores).reduce(function(a,b){return a+(b||0)},0)
    var conclusionType=deriveConclusion()
    post('vasantpur:sessionComplete',{clusterId:null,scenarioId:null,clusterTopic:null,
      persona:PERSONA,answers:sessionAnswers,scores:sessionScores,totalScore:totalScore,
      roundTimingsMs:beatTimings,answerChanges:answerChanges,revealsEngaged:revealsEngaged,
      completedAt:new Date().toISOString(),firstSrcFr:firstSrcFr,b2Delta:b2Delta,conclusionType:conclusionType,decisions:[]})
    return{totalScore:totalScore,conclusionType:conclusionType}
  }

  function deriveConclusion(){
    var s=sessionAnswers
    if(s.b3_silence===2)return 'silence_spotter'
    if(s.b3_silence===0&&s.b4_anno==='lazy')return 'pattern_reader'
    if(s.b2_update===1&&!s.b3_silence)return 'confirmed_reader'
    if(s.b1_src===3&&s.b2_update===1)return 'intensity_follower'
    if(s.b2_update===2&&!s.b5_edits)return 'overwhelmed'
    return 'pattern_reader'
  }

  // Listen for community stats coming back from React
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'vasantpur:communityStats') {
      window._communityStats = e.data.payload
    }
  })

  return{init:init,decision:decision,beatComplete:beatComplete,scryEngaged:scryEngaged,finish:finish}
})()

  setTimeout(function(){
    var co=document.createElement('div');co.className='ocard'
    co.innerHTML='<span class="ocard-tag" style="color:var(--ink3)">What '+totalSessions+' players believed this session</span><div class="obar"><div class="ob" id="ob0" style="width:0;background:var(--green)"></div><div class="ob" id="ob1" style="width:0;background:var(--amber)"></div><div class="ob" id="ob2" style="width:0;background:var(--red)"></div></div><div class="oleg"><div class="ole"><div class="olc" style="background:var(--green)"></div>Independent review '+sims[0]+'%</div><div class="ole"><div class="olc" style="background:var(--amber)"></div>Conditional '+sims[1]+'%</div><div class="ole"><div class="olc" style="background:var(--red)"></div>Proceed '+sims[2]+'%</div></div>'
    N().insertBefore(co,$('hw'))

    var your=document.createElement('div');your.className='ocard'
    your.innerHTML='<span class="ocard-tag" style="color:'+outs[v].c+'">Your outcome</span><div class="ocard-title">'+outs[v].t+'</div><div class="ocard-desc">'+outs[v].d+'</div>'
    N().insertBefore(your,$('hw'))

    var srcNames=[(STORY.srcs[0]&&STORY.srcs[0].pub)||'the official source',(STORY.srcs[1]&&STORY.srcs[1].pub)||'the mainstream paper','multiple sources','a colleague\'s take']
    var updateLabels=['held both framings without collapsing','defaulted to the established outlet','stayed genuinely uncertain','reflected it back']
    var silenceLabels=['noticed the absence of named sources','moved past the silence','sought direct testimony','turned the absence into a question']
    var wireLabels=['understood three bylines does not mean three sources','held the sourcing failure lightly','traced the sentence to its origin','named the sourcing failure publicly']

    var srcIdx=S.src>-1?S.src:0
    var pr=document.createElement('div');pr.className='profile'
    pr.innerHTML='<div class="profile-lbl">The shape of how you read this story</div><div class="prow"><div class="prow-dot" style="background:'+STORY.srcs[srcIdx].col+'"></div><div><div class="prow-label">Trust hierarchy</div><div class="prow-val">You read <strong>'+(srcNames[S.src>-1?S.src:1])+'</strong> first. Your first read set the frame for everything that followed.</div></div></div><div class="prow"><div class="prow-dot" style="background:var(--blue)"></div><div><div class="prow-label">How you update</div><div class="prow-val">When shown the second article, you <em>'+(updateLabels[S.b2d>-1?S.b2d:0])+'</em>.</div></div></div><div class="prow"><div class="prow-dot" style="background:var(--green)"></div><div><div class="prow-label">Silence sensitivity</div><div class="prow-val">You <em>'+(silenceLabels[S.b3d>-1?S.b3d:1])+'</em>. SCRY showed major outlets went silent on a story in their core beat.</div></div></div><div class="prow"><div class="prow-dot" style="background:var(--red)"></div><div><div class="prow-label">Source attribution</div><div class="prow-val">When the wire sentence was found, you <em>'+(wireLabels[S.b4d>-1?S.b4d:0])+'</em>.</div></div></div><div class="prow"><div class="prow-dot" style="background:var(--accent)"></div><div><div class="prow-label">Synthesis under pressure</div><div class="prow-val">'+(S.edits>0?'You changed '+S.edits+' phrase'+(S.edits>1?'s':'')+' — the edits reflect what you trusted and what you did not.':'You left your statement as drafted — the first read held.')+'</div></div></div>'
    N().insertBefore(pr,$('hw'))

    var prox=document.createElement('div');prox.className='proximity'
    prox.innerHTML='<div class="proximity-lbl">One more thing</div><div class="proximity-txt">You had a personal stake in this story. <strong>'+((CHAR&&CHAR.personal_stake)||'Someone you know is directly affected by what is being decided.')+'</strong><br><br>'+((CHAR&&CHAR.conflict)||'The question is not whether you were affected. It is whether you knew you were, and named it to yourself.')+'<br><br><em>Most readers who respond to news stories do so with some degree of personal stake. The question is whether you knew you were, and named it to yourself.</em></div>'
    N().insertBefore(prox,$('hw'))

    nxt('Play again → a different story',restart)
    setTimeout(function(){
      $('ob0').style.width=sims[0]+'%';$('ob1').style.width=sims[1]+'%';$('ob2').style.width=sims[2]+'%'
      sd()
    },600)
  },3000)
}

function nextBeat(){
  GE.beatComplete(beat)
  beat++;phase=0
  var desc=getSceneDesc(beat)
  var palette=(desc&&desc.palette)||'warm_dawn'
  var timeLabels={warm_dawn:'Early morning',blue_night:'Evening',amber_evening:'Late afternoon',grey_overcast:'Morning',harsh_noon:'Noon',deep_evening:'Night'}
  var timeStr=(timeLabels[palette]||'Later')+' · Beat '+beat+' of 5'
  setScene(beat,timeStr,function(){render()})
}

function restart(){
  beat=1;phase=0
  S.src=S.b1r=S.b2d=S.b3d=S.b4d=S.b5d=S.anno=-1;S.edits=0;S.touchedPersonal=false
  setScene(1,((STORY&&STORY.location_name)||'Vasantpur')+'  ·  Beat 1',function(){render()})
}

function tH(){ho=!ho;$('htxt').classList.toggle('on',ho);$('htb').textContent=ho?'↑ hide':'? hint'}
function pw(btn){
  if(wplay)return;wplay=true
  var w=btn.closest('.cbub').querySelector('.vnw');if(!w)return
  var bars=w.querySelectorAll('.vb')
  bars.forEach(function(b,i){b.classList.add('on');b.style.animation='wba '+(0.4+Math.random()*0.7)+'s ease infinite '+(i*0.04)+'s';})
  setTimeout(function(){bars.forEach(function(b){b.classList.remove('on');b.style.animation=''});wplay=false},2900)
}


// ═══════════════════════════════════════════════════════════════════
// INIT — Wait for scenario via postMessage
// ═══════════════════════════════════════════════════════════════════

// Show loading state immediately
var loader=document.createElement('div')
loader.id='loading';loader.className='p in'
loader.innerHTML='<span style="font-family:\'Courier New\',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink4)">Loading today\'s story...</span>'
N().insertBefore(loader,$('hw'))

$('scene').innerHTML='<div id="sfade" style="position:absolute;inset:0;background:var(--page);opacity:0;pointer-events:none;transition:opacity .65s;z-index:2"></div><div id="stime" style="position:absolute;bottom:0;left:0;right:0;z-index:3;padding:10px 18px 12px;background:linear-gradient(transparent,rgba(15,13,11,.96));font-family:\'Courier New\',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)">Loading...</div>'+buildDefaultScene()
bw()

// ─────────────────────────────────────────────────────────────────
// MESSAGE LISTENER
// Accepts messages from any origin ('*') since iframe origin can be
// 'null' in some environments. Filters by message type instead.
// ─────────────────────────────────────────────────────────────────
window.addEventListener('message', function(e) {
  // No origin check — we filter by message type
  // This is safe because messages contain no sensitive data

  if (!e.data || !e.data.type) return

  if (e.data.type === 'vasantpur:setScenario') {
    STORY = e.data.payload
    CHAR  = STORY.character || {}
    LOC   = STORY.human_scale_location || {}
    CAST  = STORY.supporting_cast || []

    var loader = $('loading')
    if (loader) loader.remove()

    GE.init(STORY, null)

    var desc    = getSceneDesc(1)
    var location = STORY.location_name || (CHAR.name && CHAR.name.split(' ')[1]) || 'Vasantpur'
    var palette  = (desc && desc.palette) || 'warm_dawn'
    var timeLabelMap = {warm_dawn:'Early morning',harsh_noon:'Morning',amber_evening:'Evening',blue_night:'Night',grey_overcast:'Morning',deep_evening:'Night'}
    var timeLabel = timeLabelMap[palette] || 'Morning'

    setScene(1, timeLabel + ' · ' + location, function() {
      $('tbb').textContent = 'Beat 1 of 5'
      dots()
      render()
    })
    return
  }

  if (e.data.type === 'vasantpur:communityStats') {
    window._communityStats = e.data.payload
  }
})

// Signal readiness to parent
window.parent.postMessage({ type: 'vasantpur:ready' }, '*')
</script>
