<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══════════════════════════════════════════
         FAVICON + ICONS
    ═══════════════════════════════════════════ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-32.png" />

    <!-- ═══════════════════════════════════════════
         VIEWPORT + THEME
    ═══════════════════════════════════════════ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- ═══════════════════════════════════════════
         PRIMARY SEO
    ═══════════════════════════════════════════ -->
    <title>SCRY — Narrative Intelligence for News Media</title>

    <meta
      name="description"
      content="SCRY analyzes how news narratives are constructed across publishers. Track political framing, emotional intensity, contextual accuracy, and narrative signals in Indian media."
    />

    <meta
      name="keywords"
      content="media analysis platform, narrative intelligence, news framing analysis, Indian media research, computational journalism, political communication analysis, narrative analysis news, AI media analysis, SCRY"
    />

    <meta name="author" content="SCRY" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.scry.in/" />

    <!-- ═══════════════════════════════════════════
         OPEN GRAPH (LinkedIn, WhatsApp, Facebook)
    ═══════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.scry.in/" />
    <meta property="og:site_name" content="SCRY" />
    <meta property="og:title" content="SCRY — Narrative Intelligence for News Media" />
    <meta
      property="og:description"
      content="Analyze how political narratives evolve across news publishers. SCRY transforms news articles into structured narrative intelligence."
    />
    <meta property="og:image" content="https://www.scry.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SCRY Narrative Intelligence Platform" />
    <meta property="og:locale" content="en_IN" />

    <!-- ═══════════════════════════════════════════
         TWITTER / X CARD
    ═══════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SCRY — Narrative Intelligence for News Media" />
    <meta
      name="twitter:description"
      content="Track political framing, narrative signals, and emotional intensity across news publishers."
    />
    <meta name="twitter:image" content="https://www.scry.in/og-image.png" />

    <!-- ═══════════════════════════════════════════
         STRUCTURED DATA (JSON-LD)
    ═══════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SCRY",
      "url": "https://www.scry.in",
      "description": "Narrative intelligence platform for analyzing how news articles frame political events and construct narratives across publishers.",
      "applicationCategory": "ResearchApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "keywords": "narrative intelligence, media analysis, news framing, computational journalism, political communication",
      "inLanguage": "en-IN"
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
